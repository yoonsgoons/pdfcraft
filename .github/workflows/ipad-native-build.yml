
name: PDFCraft Native iPad Build

on:
  workflow_dispatch:

jobs:
  build-ipad:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/pdfcraft-ipad
        run: xcodegen generate

      - name: Build native iPad app
        working-directory: apps/pdfcraft-ipad
        run: |
          xcodebuild \
            -project PDFCraftiPad.xcodeproj \
            -scheme PDFCraftiPad \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build


      - name: Build for physical iPad
        working-directory: apps/pdfcraft-ipad
        run: |
          xcodebuild \
            -project PDFCraftiPad.xcodeproj \
            -scheme PDFCraftiPad \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: apps/pdfcraft-ipad
        run: |
          mkdir -p Payload
          cp -R build-device/Build/Products/Debug-iphoneos/PDFCraftiPad.app Payload/
          zip -qr PDFCraftiPad-unsigned.ipa Payload

      - name: Upload iPad IPA
        uses: actions/upload-artifact@v4
        with:
          name: PDFCraft-iPad-Unsigned
          path: apps/pdfcraft-ipad/PDFCraftiPad-unsigned.ipa
          if-no-files-found: error
