
name: iPad Web Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build PDFCraft Web
        working-directory: apps/pdfcraft-web
        run: trunk build --release

      - name: Package web application
        run: bash packaging/web/package.sh --skip-build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-ipad-web
          path: dist/pdfcraft-web-*.zip
          if-no-files-found: error
          retention-days: 14
